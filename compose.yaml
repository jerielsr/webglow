services:
  webglow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBGLOW_PORT:-1828}:1828"
      - "${WEBGLOW_HTTPS_HOST_PORT:-18443}:${WEBGLOW_HTTPS_PORT:-18443}"
    environment:
      # Set this in a local .env file or Portainer stack variable before deployment.
      WEBGLOW_API_TOKEN: "${WEBGLOW_API_TOKEN:-}"
      # Keep this separate from the portal password. It enables password recovery from Setup.
      WEBGLOW_PASSWORD_RESET_TOKEN: "${WEBGLOW_PASSWORD_RESET_TOKEN:-}"
      WEBGLOW_CORS_ORIGIN: "${WEBGLOW_CORS_ORIGIN:-*}"
      WEBGLOW_HTTPS_ENABLED: "${WEBGLOW_HTTPS_ENABLED:-true}"
      WEBGLOW_HTTPS_PORT: "${WEBGLOW_HTTPS_PORT:-18443}"
      WEBGLOW_HTTPS_PUBLIC_PORT: "${WEBGLOW_HTTPS_HOST_PORT:-18443}"
      WEBGLOW_PUBLIC_URL: "${WEBGLOW_PUBLIC_URL:-}"
      WEBGLOW_TLS_CERT_FILE: "${WEBGLOW_TLS_CERT_FILE:-}"
      WEBGLOW_TLS_KEY_FILE: "${WEBGLOW_TLS_KEY_FILE:-}"
      WEBGLOW_TLS_HOSTS: "${WEBGLOW_TLS_HOSTS:-}"
    volumes:
      - webglow-data:/data
    restart: unless-stopped

volumes:
  webglow-data:

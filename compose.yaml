services:
  webglow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEBGLOW_PORT:-1828}:1828"
    environment:
      # Set this in a local .env file or Portainer stack variable before deployment.
      WEBGLOW_API_TOKEN: "${WEBGLOW_API_TOKEN:-}"
      # Keep this separate from the portal password. It enables password recovery from Setup.
      WEBGLOW_PASSWORD_RESET_TOKEN: "${WEBGLOW_PASSWORD_RESET_TOKEN:-}"
      WEBGLOW_CORS_ORIGIN: "${WEBGLOW_CORS_ORIGIN:-*}"
    volumes:
      - webglow-data:/data
    restart: unless-stopped

volumes:
  webglow-data:

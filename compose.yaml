services:
  webglow:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Set this in a local .env file before exposing the API beyond your trusted LAN.
      WEBGLOW_API_TOKEN: ${WEBGLOW_API_TOKEN:-}
    volumes:
      - webglow-data:/data
    restart: unless-stopped

volumes:
  webglow-data:

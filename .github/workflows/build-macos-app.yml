name: Build macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG
        run: npm run desktop:mac

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.dmg --verify-tag --title "WebGlow $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Upload manual build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: WebGlow-universal-macOS
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
